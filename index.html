<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#2b1033">
<title>Удвалцэцэгт зориулав 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg1:#2b1033;--bg2:#4a1d4f;--ink:#ffe8f2;--pink:#ff6fa5;--yellow:#ffd23f;--mint:#4fd1b3;--lav:#a98bff;--card:rgba(255,255,255,.13);--btn:#ff4f93;--btntext:#fff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{min-height:100%;background:#2b1033;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;color:var(--ink);font-family:"Nunito",system-ui,sans-serif;font-weight:600;overflow-x:hidden;text-align:center}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(160deg,var(--bg1),var(--bg2))}
main{position:relative;z-index:2;max-width:560px;margin:0 auto;padding:28px 18px 48px}
.hi{font-family:"Pacifico",cursive;font-size:clamp(22px,6vw,32px);margin:6px 0 0;color:var(--pink)}
h1{font-family:"Pacifico",cursive;font-weight:400;font-size:clamp(40px,13vw,72px);line-height:1.1;margin:4px 0 26px;display:flex;flex-wrap:wrap;justify-content:center}
h1 span{display:inline-block;animation:pop .7s cubic-bezier(.3,1.6,.5,1) both}
h1 span:nth-child(3n){color:var(--pink)}h1 span:nth-child(3n+1){color:var(--lav)}h1 span:nth-child(3n+2){color:var(--mint)}
@keyframes pop{from{transform:translateY(-40px) scale(.2) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}
.sub{font-size:18px;margin:0 0 4px;position:relative;z-index:2}
#cake{width:min(86vw,360px);height:auto;margin-top:6px;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.fl{cursor:pointer}
.fp{transform-box:fill-box;transform-origin:50% 100%;transition:transform .35s,opacity .35s;animation:flick .35s ease-in-out infinite alternate}
.fl.off .fp{transform:scale(0);opacity:0;animation:none}
@keyframes flick{from{transform:scale(1,1) rotate(-4deg)}to{transform:scale(.88,1.12) rotate(4deg)}}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
button{font:inherit;font-weight:800;font-size:17px;border:0;border-radius:999px;padding:13px 22px;background:var(--btn);color:var(--btntext);cursor:pointer;box-shadow:0 6px 0 rgba(120,20,70,.35);transition:transform .1s,box-shadow .1s}
button:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(120,20,70,.35)}
button:focus-visible,.fl:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
.msg{display:none;background:var(--card);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-radius:28px;padding:22px 20px;margin-top:10px;font-size:18px;line-height:1.55}
.msg.show{display:block;animation:pop .8s cubic-bezier(.3,1.6,.5,1) both}
.msg b{font-family:"Pacifico",cursive;font-weight:400;font-size:26px;color:var(--pink);display:block;margin-bottom:6px}
.b{position:fixed;left:var(--x);bottom:-20vh;width:var(--s);height:calc(var(--s)*1.22);border-radius:50% 50% 48% 48%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.75),transparent 28%),var(--c);opacity:.85;z-index:1;pointer-events:none;animation:rise var(--d) linear var(--dl) infinite}
.b::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:46px;background:currentColor;opacity:.35}
@keyframes rise{0%{transform:translate(0,0)}25%{transform:translate(18px,-35vh)}50%{transform:translate(-14px,-70vh)}100%{transform:translate(8px,-140vh)}}
#cf{position:fixed;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
.lyr{margin-top:16px;min-height:5.5em;font-family:"Pacifico",cursive;font-size:20px;line-height:1.4;color:var(--pink)}
.lyr p{margin:3px 0;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
@media (min-width:700px){main{max-width:720px;padding-top:40px}#cake{width:430px}.sub{font-size:21px}.msg{font-size:21px;padding:28px}.lyr{font-size:24px}button{font-size:19px}}
@media (max-height:520px) and (orientation:landscape){#cake{width:220px}}
@media (prefers-reduced-motion:reduce){.b,#cake,.fp,h1 span{animation:none}}
</style>
</head>
<body>
<canvas id="cf"></canvas>
<main>
  <p class="hi">Төрсөн өдрийн мэнд,</p>
  <h1 id="name" aria-label="Удвалцэцэг"></h1>
  <p class="sub" id="sub">Хүслээ бодоод, лаагаа үлээгээрэй 🕯️</p>

  <svg id="cake" viewBox="0 0 300 270" role="img" aria-label="Төрсөн өдрийн бялуу">
    <ellipse cx="150" cy="248" rx="135" ry="16" fill="#a98bff"/>
    <rect x="38" y="160" width="224" height="84" rx="18" fill="#ff6fa5"/>
    <path d="M38 178c0-24 18-18 24-4 6 14 18 14 24-2 7-16 20-14 26 0 6 14 20 14 26-2 6-16 22-14 28 2 6 14 20 12 26-2 6-14 24-12 24 8v-10c0-12-8-20-20-20H58c-12 0-20 8-20 20z" fill="#fff"/>
    <rect x="76" y="108" width="148" height="58" rx="16" fill="#ffd23f"/>
    <path d="M76 126c0-20 14-14 20-2 6 12 16 12 22-2 6-14 18-12 24 0 6 12 16 12 22-2 6-14 20-10 22 4 4-2 14-6 18 2v-8c0-10-6-16-16-16H92c-10 0-16 6-16 16z" fill="#fff"/>
    <g fill="#4fd1b3"><rect x="62" y="196" width="12" height="5" rx="2.5" transform="rotate(20 68 198)"/><rect x="120" y="212" width="12" height="5" rx="2.5" transform="rotate(-30 126 214)"/><rect x="190" y="198" width="12" height="5" rx="2.5" transform="rotate(40 196 200)"/><rect x="236" y="214" width="12" height="5" rx="2.5" transform="rotate(-15 242 216)"/></g>
    <g fill="#fff"><rect x="90" y="226" width="12" height="5" rx="2.5" transform="rotate(-20 96 228)"/><rect x="160" y="228" width="12" height="5" rx="2.5" transform="rotate(25 166 230)"/><rect x="212" y="170" width="12" height="5" rx="2.5" transform="rotate(-35 218 172)"/></g>
    <g>
      <rect x="107" y="70" width="12" height="40" rx="4" fill="#4fd1b3"/><rect x="144" y="66" width="12" height="44" rx="4" fill="#a98bff"/><rect x="181" y="70" width="12" height="40" rx="4" fill="#ff6fa5"/>
      <g fill="#fff" opacity=".7"><rect x="107" y="80" width="12" height="5"/><rect x="144" y="78" width="12" height="5"/><rect x="181" y="80" width="12" height="5"/></g>
    </g>
    <g class="fl" tabindex="0" role="button" aria-label="Лааг унтраах" transform="translate(113 66)"><circle cx="0" cy="-12" r="20" fill="transparent"/><path class="fp" d="M0 0C-8-8-5-18 0-28 5-18 8-8 0 0Z" fill="#ffb300"/><path class="fp" d="M0 0C-4-4-2-10 0-15 2-10 4-4 0 0Z" fill="#fff4a8"/></g>
    <g class="fl" tabindex="0" role="button" aria-label="Лааг унтраах" transform="translate(150 62)"><circle cx="0" cy="-12" r="20" fill="transparent"/><path class="fp" d="M0 0C-8-8-5-18 0-28 5-18 8-8 0 0Z" fill="#ffb300"/><path class="fp" d="M0 0C-4-4-2-10 0-15 2-10 4-4 0 0Z" fill="#fff4a8"/></g>
    <g class="fl" tabindex="0" role="button" aria-label="Лааг унтраах" transform="translate(187 66)"><circle cx="0" cy="-12" r="20" fill="transparent"/><path class="fp" d="M0 0C-8-8-5-18 0-28 5-18 8-8 0 0Z" fill="#ffb300"/><path class="fp" d="M0 0C-4-4-2-10 0-15 2-10 4-4 0 0Z" fill="#fff4a8"/></g>
  </svg>

  <div class="row">
    <button id="blow">Лаагаа үлээх 💨</button>
  </div>

  <section class="msg" id="msg" aria-live="polite">
    <b>Төрсөн өдрийн мэнд хүргэе!</b>
    19 настай том охин болж байгаа юм байна шүү дээ. За тэгээд мундаг шүү, их ядарч байгаа байх тэхдээ зүгээрээ, чи чадна мундаг юм чинь за юу, гадаа хүйтэн байна шүү дулаан хувцсаа өмсөөрэй. 💖
    <div class="lyr" id="lyr"></div>
  </section>
</main>

<script>
(function(){
  var colors=["#ff6fa5","#ffd23f","#4fd1b3","#a98bff","#ff9f6b","#6bc5ff"];
  var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

  // name letters
  var h=document.getElementById("name");
  "Удвалцэцэг".split("").forEach(function(ch,i){
    var s=document.createElement("span");s.textContent=ch;s.style.animationDelay=(i*0.08)+"s";h.appendChild(s);
  });

  // balloons
  function balloons(n,fast){
    for(var i=0;i<n;i++){
      var b=document.createElement("div");b.className="b";
      b.style.setProperty("--x",(Math.random()*95)+"vw");
      b.style.setProperty("--s",(34+Math.random()*34)+"px");
      b.style.setProperty("--c",colors[i%colors.length]);
      b.style.setProperty("--d",(fast?5+Math.random()*4:11+Math.random()*9)+"s");
      b.style.setProperty("--dl",(fast?Math.random()*1.5:-Math.random()*18)+"s");
      b.style.color=colors[i%colors.length];
      document.body.appendChild(b);
      if(fast)setTimeout(function(el){el.remove()},10500,b);
    }
  }
  balloons(12,false);

  // confetti
  var cv=document.getElementById("cf"),cx=cv.getContext("2d"),parts=[],raf=0;
  function size(){cv.width=innerWidth;cv.height=innerHeight}
  size();addEventListener("resize",size);
  function confetti(){
    if(reduce)return;
    for(var i=0;i<170;i++){
      parts.push({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,w:6+Math.random()*7,h:4+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:colors[i%colors.length]});
    }
    if(!raf)raf=requestAnimationFrame(tick);
  }
  function tick(){
    cx.clearRect(0,0,cv.width,cv.height);
    parts=parts.filter(function(p){return p.y<cv.height+20});
    parts.forEach(function(p){
      p.vy+=.28;p.vx*=.992;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore();
    });
    raf=parts.length?requestAnimationFrame(tick):0;
    if(!raf)cx.clearRect(0,0,cv.width,cv.height);
  }

  // Happy Birthday melody (public domain), played with a soft music-box tone
  var AC=window.AudioContext||window.webkitAudioContext,actx=null;
  var N={G4:392,A4:440,B4:493.88,C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99};
  var tune=[
    [["G4",.75],["G4",.25],["A4",1],["G4",1],["C5",1],["B4",2]],
    [["G4",.75],["G4",.25],["A4",1],["G4",1],["D5",1],["C5",2]],
    [["G4",.75],["G4",.25],["G5",1],["E5",1],["C5",1],["B4",1],["A4",2]],
    [["F5",.75],["F5",.25],["E5",1],["C5",1],["D5",1],["C5",2]]
  ];
  var words=["Төрсөн өдрийн мэнд хүргэе,","Төрсөн өдрийн мэнд хүргэе,","Төрсөн өдрийн мэнд хүргэе, Удвалцэцэг,","Төрсөн өдрийн мэнд хүргэе!"];
  function song(){
    var lyr=document.getElementById("lyr");lyr.innerHTML="";
    var beat=.45,t=.6;
    try{actx=actx||new AC();if(actx.state==="suspended")actx.resume()}catch(e){actx=null}
    tune.forEach(function(ph,i){
      setTimeout(function(){var p=document.createElement("p");p.textContent=words[i];lyr.appendChild(p)},t*1000);
      ph.forEach(function(n){
        if(actx){
          var o=actx.createOscillator(),g=actx.createGain(),s=actx.currentTime+t,len=n[1]*beat;
          o.type="triangle";o.frequency.value=N[n[0]];
          g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.22,s+.02);g.gain.exponentialRampToValueAtTime(.001,s+len+.5);
          o.connect(g);g.connect(actx.destination);o.start(s);o.stop(s+len+.55);
        }
        t+=n[1]*beat;
      });
    });
  }

  // candles
  var flames=[].slice.call(document.querySelectorAll(".fl"));
  var lit=flames.length,msg=document.getElementById("msg"),sub=document.getElementById("sub");
  function out(f){
    if(f.classList.contains("off"))return;
    f.classList.add("off");lit--;
    if(lit===0)celebrate();
  }
  function blowAll(){flames.forEach(function(f,i){setTimeout(function(){out(f)},i*160)})}
  function celebrate(){
    sub.textContent="Хүсэл чинь биелэх болно";
    msg.classList.add("show");
    confetti();balloons(14,true);song();
    setTimeout(function(){msg.scrollIntoView({behavior:reduce?"auto":"smooth",block:"center"})},400);
  }
  flames.forEach(function(f){
    f.addEventListener("click",function(){out(f)});
    f.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();out(f)}});
  });
  document.getElementById("blow").addEventListener("click",blowAll);

})();
</script>
</body>
</html>
